<header class="app-header">
  <a class="brand" routerLink="/scenario" aria-label="Аким на 5 часов — главная">
    <span class="brand-mark" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </span>
    <span>
      <strong>Аким на 5 часов</strong>
      <small>AI-симулятор управления городом</small>
    </span>
  </a>

  <nav aria-label="Основная навигация">
    <a routerLink="/scenario" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Сценарий</a>
    <a routerLink="/results" routerLinkActive="active">Результаты</a>
  </nav>

  <section
    class="header-budget"
    [attr.aria-label]="'Бюджет: использовано ' + store.spentBudget() + ' из ' + store.totalBudget()"
  >
    <div class="budget-copy">
      <span>Бюджет</span>
      <strong>{{ store.spentBudget() }} / {{ store.totalBudget() }}</strong>
      <small>Осталось {{ store.remainingBudget() }}</small>
    </div>
    <nz-progress
      [nzPercent]="store.budgetUsagePercent()"
      [nzShowInfo]="false"
      [nzStrokeWidth]="6"
    />
  </section>

  <time class="header-clock" [attr.datetime]="now().toISOString()">
    <small>{{ currentDate() }}</small>
    <strong>{{ currentTime() }}</strong>
  </time>

  <div class="header-actions">
    <span class="user">
      <nz-avatar nzIcon="user"></nz-avatar>
      <span>Участник</span>
      <nz-icon nzType="down" />
    </span>
  </div>
</header>
