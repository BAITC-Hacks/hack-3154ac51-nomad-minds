<header class="app-header">
  <a class="brand" routerLink="/scenario" aria-label="SmartAkim — главная">
    <span class="brand-mark" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </span>
    <span>
      <strong>SmartAkim</strong>
      <small>AI-симулятор управления городом</small>
    </span>
  </a>

  <nav aria-label="Основная навигация">
    <a routerLink="/scenario" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Сценарий</a>
    <a routerLink="/results" routerLinkActive="active">Результаты</a>
  </nav>

  <section
    class="header-budget"
    [attr.aria-label]="'Бюджет: использовано ' + store.spentBudget() + ' млн из ' + store.totalBudget() + ' млн'"
  >
    <div class="budget-copy">
      <span>Бюджет</span>
      <strong>{{ store.spentBudget() }} / {{ store.totalBudget() }} млн</strong>
      <small>Осталось {{ store.remainingBudget() }} млн</small>
    </div>
    <nz-progress
      [nzPercent]="store.budgetUsagePercent()"
      [nzShowInfo]="false"
      [nzStrokeWidth]="6"
    />
  </section>

  <time class="header-clock" [attr.datetime]="now().toISOString()">
    <small>{{ currentDate() }}</small>
    <strong>{{ currentTime() }}</strong>
  </time>
</header>
