<header class="app-header">
  <a class="brand" routerLink="/scenario" aria-label="Аким на 5 часов — главная">
    <span class="brand-mark" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </span>
    <span>
      <strong>Аким на 5 часов</strong>
      <small>AI-симулятор управления городом</small>
    </span>
  </a>

  <nav aria-label="Основная навигация">
    <a routerLink="/scenario" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Сценарий</a>
    <a routerLink="/results" routerLinkActive="active">Результаты</a>
    <a routerLink="/comparison" routerLinkActive="active">Сравнение команд</a>
    <a routerLink="/project-info" routerLinkActive="active">README</a>
  </nav>

  <div class="header-actions">
    <button nz-button nzType="default" type="button" (click)="store.saveScenario()">
      <nz-icon [nzType]="store.isSaved() ? 'check' : 'save'" />
      {{ store.isSaved() ? 'Сохранено' : 'Сохранить' }}
    </button>
    <button nz-button nzType="primary" type="button" (click)="store.restoreDemo()">
      <nz-icon nzType="play-circle" />
      Презентация
    </button>
    <span class="user">
      <nz-avatar nzIcon="user"></nz-avatar>
      <span>Участник</span>
      <nz-icon nzType="down" />
    </span>
  </div>
</header>
