<main id="scenario" class="scenario-page">
  @if (store.isLoading()) {
    <div class="dataset-status" role="status"><nz-spin nzSimple /><span>Загрузка данных города…</span></div>
  }
  @if (store.loadError(); as error) {
    <div class="dataset-status">
      <nz-alert nzType="error" nzShowIcon [nzMessage]="error" />
      <button nz-button type="button" [disabled]="store.isLoading()" (click)="store.loadDataset()">Повторить загрузку</button>
    </div>
  }
  @if (store.hasDataset()) {
  <section class="workspace-row workspace-planning" aria-label="Районы города и планирование решений">
    <app-district-list />
    <div class="workspace-decisions">
      <app-measure-catalog />
      <app-selected-decisions />
    </div>
  </section>
  <section class="workspace-row workspace-map" aria-label="Карта районов города">
    <app-city-map />
  </section>
  }
</main>
