<main class="scenario-results-page">

      <p>Результаты расчёта</p>
      <h1>{{ store.scenarioName().trim() || 'Мой сценарий' }}</h1>

  <section class="results-grid" aria-label="Результаты и AI-анализ сценария">

</main>
