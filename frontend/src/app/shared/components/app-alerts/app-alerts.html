<section class="app-alerts" aria-label="Уведомления">
  @for (alert of notifications.alerts(); track alert.id) {
    <div
      class="app-alert"
      [attr.role]="alert.type === 'error' || alert.type === 'warning' ? 'alert' : 'status'"
      aria-atomic="true"
    >
      <nz-alert
        [nzType]="alert.type"
        [nzMessage]="alert.title"
        [nzDescription]="alert.message"
        nzShowIcon
        nzCloseable
        [nzCloseText]="closeIcon"
        (nzOnClose)="notifications.dismiss(alert.id)"
      />
    </div>
  }
</section>
<ng-template #closeIcon>
  <nz-icon nzType="close" aria-hidden="true" />
  <span class="visually-hidden">Закрыть уведомление</span>
</ng-template>
